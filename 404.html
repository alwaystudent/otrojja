  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      (function () {
        var loaded = false;
        function injectFallbackBundle() {
          if (loaded) return;
          var root = document.getElementById('root');
          if (root && root.children.length > 0) return;
          loaded = true;
          var tryLoadJs = function (paths, idx) {
            if (idx >= paths.length) return;
            var script = document.createElement('script');
            script.type = 'module';
            script.src = paths[idx];
            script.onerror = function () {
              tryLoadJs(paths, idx + 1);
            };
            document.body.appendChild(script);
          };
          tryLoadJs(['./public/gh-pages-fallback.js', './gh-pages-fallback.js'], 0);
        }
        window.addEventListener(
          'error',
          function (e) {
            if (
              e.target &&
              e.target.tagName === 'SCRIPT' &&
              e.target.src &&
              e.target.src.indexOf('main.tsx') !== -1
            ) {
              injectFallbackBundle();
            }
          },
          true
        );
        window.addEventListener('DOMContentLoaded', function () {
          setTimeout(injectFallbackBundle, 650);
        });
      })();
    </script>
  </body>
</html>
