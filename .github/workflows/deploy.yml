name: Deploy Static HTML & JS to GitHub Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy_static_html_js:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stage pure HTML and JavaScript files only
        run: |
          mkdir -p ./_gh_pages/public
          cp ./index.html ./_gh_pages/index.html
          cp ./index.html ./_gh_pages/404.html
          cp ./public/gh-pages-fallback.js ./_gh_pages/gh-pages-fallback.js
          cp ./public/gh-pages-fallback.js ./_gh_pages/public/gh-pages-fallback.js
          touch ./_gh_pages/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload HTML & JS artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_gh_pages'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

