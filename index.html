  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      (function () {
        var loaded = false;
        function injectFallbackBundle() {
          if (loaded) return;
          var root = document.getElementById('root');
          if (root && root.children.length > 0) return;
          loaded = true;
          var css = document.createElement('link');
          css.rel = 'stylesheet';
          css.href = './public/gh-pages-fallback.css';
          document.head.appendChild(css);
          var script = document.createElement('script');
          script.type = 'module';
          script.src = './public/gh-pages-fallback.js';
          document.body.appendChild(script);
        }
        window.addEventListener(
          'error',
          function (e) {
            if (
              e.target &&
              e.target.tagName === 'SCRIPT' &&
              e.target.src &&
              e.target.src.indexOf('main.tsx') !== -1
            ) {
              injectFallbackBundle();
            }
          },
          true
        );
        window.addEventListener('DOMContentLoaded', function () {
          setTimeout(injectFallbackBundle, 900);
        });
      })();
    </script>
  </body>
